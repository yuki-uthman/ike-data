name: Refresh sales + expenses + today + quotations data

on:
  schedule:
    # re-registered after the repo rename (yuki-uthman/ike-sales)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-sales
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the payment logic against canned Odoo data
        run: python scripts/test_payments.py

      - name: Fetch today's sales + cash/transfer payments from Odoo (writes sales.json and today.json)
        env:
          ODOO_URL: https://mrh-investment.odoo.com
          ODOO_DB: mrh-investment
          ODOO_USERNAME: mrhpvt@gmail.com
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python scripts/fetch_sales.py

      - name: Fetch today's expenses from Odoo
        env:
          ODOO_URL: https://mrh-investment.odoo.com
          ODOO_DB: mrh-investment
          ODOO_USERNAME: mrhpvt@gmail.com
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python scripts/fetch_expenses.py

      - name: Fetch open quotations + unpaid orders from Odoo
        env:
          ODOO_URL: https://mrh-investment.odoo.com
          ODOO_DB: mrh-investment
          ODOO_USERNAME: mrhpvt@gmail.com
          ODOO_API_KEY: ${{ secrets.ODOO_API_KEY }}
        run: python scripts/fetch_quotations.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sales.json data/expenses.json data/today.json data/quotations.json
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: refresh sales + expenses + today + quotations data"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (likely a concurrent run pushed first) - rebasing and retrying ($i/5)"
            # -X theirs, counter-intuitively, keeps OUR data: during a rebase
            # "ours" is the upstream being replayed onto and "theirs" is the
            # commit being replayed, i.e. this run's freshly generated files.
            # Every one of these JSON files is regenerated whole each run, so
            # the newest snapshot is always the right side of a conflict.
            # Without this, a plain rebase stops on a content conflict - which
            # a rejected push over the same regenerated file guarantees - and
            # the run dies with its data unpushed.
            git pull --rebase -X theirs origin main
            sleep $((RANDOM % 10 + 1))
          done
          echo "::error::Failed to push after 5 retries"
          exit 1
